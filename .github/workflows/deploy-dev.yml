name: Deploy dev backend

# Deliberately manual and deliberately develop-only.
#
# CI (ci.yml) runs on every push. This never runs on its own: deploying the
# shared backend to frontend developers is an act someone chose, not a side
# effect of pushing a branch. `ref: develop` below is fixed regardless of
# which branch the Run button was clicked from, so a stray dispatch from a
# feature branch still ships develop.
on:
  workflow_dispatch:

# One deployment at a time, and never cancel one that is already running —
# an interrupted push can leave the Space building a half-written tree.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, then deploy develop
    runs-on: ubuntu-latest

    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Migrations run before the deploy, not after, so the new code never
      # starts against a schema that is missing what it reads. goose records
      # what it has already applied, so this is additive: a re-run is a no-op,
      # and nothing is ever dropped or re-seeded.
      #
      # Flags rather than the GOOSE_* environment variables, because a
      # migration that silently skipped would be the worst possible outcome
      # here — the deploy would still look green.
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — refusing to deploy without it"
            exit 1
          fi
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir server/migrations postgres "$DATABASE_URL" up

      - name: Assemble and Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::HF_TOKEN and HF_SPACE secrets are required"
            exit 1
          fi

          # Clone the shared space so we don't wipe out other backends (like slipwise)
          git clone -q "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          
          # 1. Update the studio source code in the space
          rm -rf space/studio
          mkdir -p space/studio
          cp -r server/go.mod server/go.sum server/cmd server/internal \
                server/docs server/migrations space/studio/

          # 2. Wire Studio into the Dockerfile if it's not already there
          if ! grep -q "studio-build" space/Dockerfile; then
            echo "Adding Studio build stage to Dockerfile..."
            # Insert build stage before the Final image stage
            sed -i '/# ---- Final image ----/i \
          # ---- Build Studio (Go) ----\n\
          FROM golang:1.26-alpine AS studio-build\n\
          WORKDIR /src\n\
          COPY studio/ .\n\
          RUN go install github.com/swaggo/swag/cmd/swag@latest\n\
          RUN swag init -g cmd/api/main.go -o docs\n\
          RUN go build -o /out/studio ./cmd/api\n' space/Dockerfile

            # Insert the binary copy in the Final image stage
            sed -i '/COPY deploy\/Caddyfile/i \
          COPY --from=studio-build /out/studio /app/studio/studio\n' space/Dockerfile
          fi

          # 3. Wire Studio into supervisord.conf if missing
          if ! grep -q "\[program:studio\]" space/deploy/supervisord.conf; then
            echo "Adding Studio to supervisord.conf..."
            cat << 'EOF' >> space/deploy/supervisord.conf

          [program:studio]
          command=/app/studio/studio
          directory=/app/studio
          autostart=true
          autorestart=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          environment=PORT="8082"
          EOF
          fi

          # 4. Wire Studio into Caddyfile if missing
          if ! grep -q "/studio/\*" space/deploy/Caddyfile; then
            echo "Adding Studio route to Caddyfile..."
            # Insert the route before the Default handle block
            sed -i '/# Default:/i \
              # Studio (Go/Echo) — internal port 8082\n\
              handle_path /studio/* {\n\
                  reverse_proxy localhost:8082\n\
              }\n' space/deploy/Caddyfile
          fi

          # 5. Commit and Push
          cd space
          git config user.name "deploy-dev"
          git config user.email "deploy@localhost"
          git add -A
          git commit -q -m "deploy(studio): ${GITHUB_SHA} from develop"
          
          # Push to the Space repo to trigger a rebuild
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main

          echo "Pushed Studio to the shared Space! The Space rebuild takes a few minutes."
          echo "Your backend will be available at: https://huggingface.co/spaces/${HF_SPACE}/studio"

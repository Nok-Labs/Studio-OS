basePath: /
definitions:
  apiresponse.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/apiresponse.FieldError'
        type: array
      message:
        type: string
    type: object
  apiresponse.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apiresponse.ErrorBody'
    type: object
  apiresponse.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.MemberEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.ProjectMemberResponse'
    type: object
  handler.MembersEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.ProjectMemberResponse'
        type: array
    type: object
  handler.ProfileEnvelope:
    properties:
      data:
        $ref: '#/definitions/model.UserProfile'
    type: object
  handler.ProjectEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.ProjectResponse'
    type: object
  handler.ProjectListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.ProjectResponse'
        type: array
    type: object
  handler.ProjectMemberResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      project_id:
        type: string
      user_id:
        type: string
    type: object
  handler.ProjectResponse:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      metadata:
        type: object
      name:
        type: string
      owner_id:
        type: string
      status:
        type: string
      summary:
        type: string
      updated_at:
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.ResendOTPRequest:
    properties:
      email:
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  handler.SignupData:
    properties:
      tokens:
        $ref: '#/definitions/handler.TokenPairResponse'
      verification_required:
        type: boolean
    type: object
  handler.SignupEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.SignupData'
    type: object
  handler.SignupRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.TaskEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TaskResponse'
    type: object
  handler.TaskListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.TaskResponse'
        type: array
    type: object
  handler.TaskResponse:
    properties:
      area:
        type: string
      assignee_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.TokenPairEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TokenPairResponse'
    type: object
  handler.TokenPairResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handler.UsernameCheck:
    properties:
      available:
        type: boolean
    type: object
  handler.UsernameCheckEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.UsernameCheck'
    type: object
  handler.VerifyRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  model.UserProfile:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      last_name:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend for Studio OS — Auth and User Management
  title: Studio OS API
  version: "1.0"
paths:
  /auth/check-username:
    get:
      description: Checks if a username is available for registration.
      parameters:
      - description: Username to check
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsernameCheckEnvelope'
        "400":
          description: missing parameter
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Check username availability
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Sends a password reset OTP to the email if it exists. Always
        answers 204, whether or not the address has an account, so the
        endpoint cannot be used to enumerate registered emails.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a token pair.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Login to account
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired token
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Refresh token pair
      tags:
      - auth
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Sends a new verification OTP to the user's email.
      parameters:
      - description: Email to resend OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: cooldown active
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Resend verification OTP
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using the OTP received via email.
      parameters:
      - description: Reset details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired OTP
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Reset password
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        Registers a new user and sends an OTP for email verification.
        A duplicate email is NOT reported as an error. The handler
        returns 202 with an identical body to a successful 201 so that
        the endpoint cannot be used to discover which addresses have
        accounts. Clients must treat 202 as "check your inbox" exactly
        as they treat 201 — no error branch exists for that case.
        A taken username is reported honestly as 409: it says nothing
        about any email address, and no account is created when it is
        returned, so masking it would tell the caller a code was sent
        for an account that does not exist.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SignupEnvelope'
        "202":
          description: duplicate email, masked as success
          schema:
            $ref: '#/definitions/handler.SignupEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: registration disabled
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: username already taken
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: too many requests
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Create a new account
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the 6-digit code sent to the user's email. Returns a token
        pair upon success.
      parameters:
      - description: Email and OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired OTP
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: too many attempts
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Confirm signup OTP and activate the account
      tags:
      - auth
  /v1/projects:
    get:
      description: Projects the caller owns or was added to, deleted ones hidden.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProjectListEnvelope'
      security:
      - BearerAuth: []
      summary: List my projects
      tags:
      - projects
    post:
      description: |-
        Creates a project owned by the caller. No member row is
        written for the owner; ownership is implied by owner_id.
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            $ref: '#/definitions/handler.ProjectEnvelope'
        "400":
          description: invalid_project_name
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /v1/projects/{id}:
    delete:
      description: |-
        Marks the project deleted; its tasks and members are hidden,
        not destroyed.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: project_not_found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Soft-delete a project (owner-only)
      tags:
      - projects
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProjectEnvelope'
        "404":
          description: project_not_found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a project
      tags:
      - projects
    patch:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProjectEnvelope'
        "403":
          description: project_owner_required
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a project (owner-only)
      tags:
      - projects
  /v1/projects/{id}/members:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MembersEnvelope'
      security:
      - BearerAuth: []
      summary: List a project's members
      tags:
      - projects
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.MemberEnvelope'
        "404":
          description: user_not_found — no account with that email
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: already_member
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a member by email (owner-only)
      tags:
      - projects
  /v1/projects/{id}/members/{userId}:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: member_not_found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Remove a member (owner-only)
      tags:
      - projects
  /v1/projects/{id}/tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskListEnvelope'
      security:
      - BearerAuth: []
      summary: List a project's tasks
      tags:
      - tasks
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: Create a task in a project
      tags:
      - tasks
  /v1/tasks/{taskId}:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: Get a task
      tags:
      - tasks
    patch:
      description: |-
        All fields are optional and act as partial updates; tags
        follow the tri-state (omitted = unchanged, [] = clear).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
  /v1/tasks/{taskId}/assignee:
    patch:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: 'Assign or unassign ({"assignee_id": null}) a task'
      tags:
      - tasks
  /v1/tasks/{taskId}/due-date:
    patch:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: Set or clear (null) a task's due date
      tags:
      - tasks
  /v1/tasks/{taskId}/status:
    patch:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskEnvelope'
      security:
      - BearerAuth: []
      summary: Move a task's status
      tags:
      - tasks
  /v1/tasks/me:
    get:
      description: |-
        The login-time board: tasks assigned to the caller across all
        live projects.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskListEnvelope'
      security:
      - BearerAuth: []
      summary: List the caller's assigned tasks
      tags:
      - tasks
  /v1/users/me:
    delete:
      description: Allows a user to permanently delete their own account.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete profile
      tags:
      - users
    get:
      description: Retrieves the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProfileEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates optional fields of the authenticated user's profile.
      parameters:
      - description: Profile details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProfileEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: username already claimed
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /v1/users/me/password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to update their password.
      parameters:
      - description: Password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
